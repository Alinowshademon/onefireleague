<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∆NE FIRE LEAGUE | Point System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0b1220;
    color:#fff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#1b2940;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,200,255,.25);
}

h1{
    text-align:center;
    color:#00cfff;
    font-size:38px;
    margin-bottom:8px;
    text-shadow:0 0 10px rgba(0,200,255,.5);
}

h2{
    text-align:center;
    color:#ffd33d;
    margin-bottom:25px;
}

.info-box{
    background:#24354a;
    border-left:5px solid #00cfff;
    border-radius:12px;
    padding:18px;
    margin-bottom:25px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#24354a;
    border-radius:15px;
    overflow:hidden;
}

th{
    background:#00cfff;
    color:#0b1220;
    padding:15px;
    font-size:18px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.08);
}

tr:hover{
    background:#314866;
}

.back{
    text-align:center;
    margin-top:30px;
}

.back a{
    display:inline-block;
    background:#00cfff;
    color:#0b1220;
    text-decoration:none;
    padding:14px 35px;
    border-radius:12px;
    font-weight:bold;
}

.back a:hover{
    background:#00b4e6;
}

@media(max-width:768px){

h1{
    font-size:30px;
}

.info-box{
    font-size:18px;
}

}

</style>

</head>

<body>

<div class="container">

<h1>🏆 ∆NE FIRE LEAGUE</h1>
<h2>Point System</h2>

<div class="info-box">
    💀 Elimination Point: <span id="elimPoints">1</span> Point
</div>

<div class="table-box">

<table>

<thead>
<tr>
<th>Position</th>
<th>Placement Points</th>
</tr>
</thead>

<tbody>

<tr><td>🥇 1st</td><td id="p1">12</td></tr>
<tr><td>🥈 2nd</td><td id="p2">9</td></tr>
<tr><td>🥉 3rd</td><td id="p3">8</td></tr>
<tr><td>4th</td><td id="p4">7</td></tr>
<tr><td>5th</td><td id="p5">6</td></tr>
<tr><td>6th</td><td id="p6">5</td></tr>
<tr><td>7th</td><td id="p7">4</td></tr>
<tr><td>8th</td><td id="p8">3</td></tr>
<tr><td>9th</td><td id="p9">2</td></tr>
<tr><td>10th</td><td id="p10">1</td></tr>

</tbody>

</table>

</div>

<div class="back">
<a href="dashboard.html">⬅️ Back</a>
</div>

</div>

<script type="module" src="pointsystem.js"></script>

</body>

</html>
