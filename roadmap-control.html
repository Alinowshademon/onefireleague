<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∆NE FIRE LEAGUE | Roadmap Control</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
color:#fff;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#1b2940;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,200,255,.25);
}

h1{
text-align:center;
color:#00cfff;
font-size:36px;
margin-bottom:8px;
text-shadow:0 0 10px rgba(0,200,255,.5);
}

h2{
text-align:center;
color:#ffd33d;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:10px;
font-weight:bold;
}

textarea{
width:100%;
height:400px;
padding:15px;
border:none;
border-radius:12px;
background:#24354a;
color:#fff;
font-size:16px;
resize:vertical;
outline:none;
}

textarea:focus{
outline:2px solid #00cfff;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:12px;
background:#00cfff;
color:#0b1220;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00b4e6;
}

#status{
margin-top:20px;
text-align:center;
font-weight:bold;
color:#7CFC00;
}

.back{
text-align:center;
margin-top:25px;
}

.back a{
display:inline-block;
background:#00cfff;
color:#0b1220;
text-decoration:none;
padding:12px 30px;
border-radius:10px;
font-weight:bold;
}

.back a:hover{
background:#00b4e6;
}

</style>

</head>

<body>

<div class="container">

<h1>🗺️ ∆NE FIRE LEAGUE</h1>
<h2>Roadmap Control</h2>

<label for="roadmap">Roadmap Information</label>

<textarea id="roadmap" placeholder="Write your roadmap here..."></textarea>

<button id="saveBtn">💾 Save Roadmap</button>

<div id="status"></div>

<div class="back">
<a href="dashboard.html">⬅️ Back</a>
</div>

</div>

<script type="module" src="roadmap-control.js"></script>

</body>

</html>
