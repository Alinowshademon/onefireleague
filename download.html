<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Download AFL App</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    body{
background:url("onebg2.jpg") center center/cover no-repeat fixed;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
position:relative;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(10,18,32,.65);
z-index:-1;
}
    
    .container {
      width: 100%;
      max-width: 420px;
      background: #111b2e;
      border: 2px solid #00bfff;
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 191, 255, .35);
    }
    
    h1 {
      font-size: 28px;
      color: #00d9ff;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #bcdcff;
      margin-bottom: 25px;
    }
    
    .logo-box {
      width: 130px;
      height: 130px;
      margin: auto;
      margin-bottom: 20px;
      border: 2px dashed #00bfff;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #09121f;
    }
    
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .info {
      font-size: 15px;
      color: #d7e8ff;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    
    .download-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #0099ff, #00d4ff);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      transition: .3s;
      box-shadow: 0 0 15px rgba(0, 191, 255, .4);
    }
    
    .download-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(0, 191, 255, .8);
    }
    
    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #8fb7d8;
      line-height: 1.5;
    }
    
    .version {
      margin-top: 18px;
      color: #00d9ff;
      font-size: 14px;
    }
    .back-btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  background: transparent;
  color: #00d9ff;
  text-decoration: none;
  font-size: 17px;
  font-weight: bold;
  border: 2px solid #00bfff;
  border-radius: 12px;
  transition: .3s;
}

.back-btn:hover {
  background: #00bfff;
  color: #0a1220;
  box-shadow: 0 0 20px rgba(0, 191, 255, .6);
}
  </style>
  
</head>

<body>
  
  <div class="container">
    
    <h1>🏆 ∆NE FIRE LEAGUE 🏆</h1>
    
    <p class="subtitle">
      Official Android App
    </p>
    
    <div class="logo-box">
      
      <!-- Replace app-logo.png with your logo -->
      <img src="∆FL.jpg" alt="App Logo">
      
    </div>
    
    <p class="info">
      
      Download the latest version of the ∆FL App to register for tournaments, receive match updates, and manage your player profile.
      
    </p>
    
    <!-- Replace ∆FL.apk with your APK file -->
    <a href="∆FL.apk" download class="download-btn">
    
      📥 Download APK
      
    </a>
    
    <p class="version">
      
      Version 1.0.0
      
    </p>
    
    <p class="note">
      
      Allow <b>Install from Unknown Sources</b> if prompted during installation.
      
    </p>
    
  </div>

</body>

</html>
