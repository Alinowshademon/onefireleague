<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
color:#fff;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:#1b2940;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,200,255,.25);
}

h1{
text-align:center;
color:#00cfff;
font-size:38px;
margin-bottom:8px;
text-shadow:0 0 10px rgba(0,200,255,.5);
}

h2{
text-align:center;
color:#ffd33d;
margin-bottom:30px;
}

.roadmap-box{
background:#24354a;
border-left:5px solid #00cfff;
border-radius:15px;
padding:25px;
font-size:18px;
line-height:1.8;
white-space:pre-wrap;
min-height:350px;
}

.back{
text-align:center;
margin-top:30px;
}

.back a{
display:inline-block;
background:#00cfff;
color:#0b1220;
text-decoration:none;
padding:14px 35px;
border-radius:12px;
font-weight:bold;
}

.back a:hover{
background:#00b4e6;
}
/* Fixed Bottom Navigation */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
height:65px;
background:#1b2740;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 20px rgba(0,195,255,.18);
z-index:1500;
}

.bottom-nav a{
text-decoration:none;
font-size:28px;
width:33.33%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
transition:.2s;
}

.bottom-nav a:hover{
background:rgba(25,199,247,.12);
transform:scale(1.08);
}
@media(max-width:768px){

h1{
font-size:30px;
}

.roadmap-box{
font-size:16px;
}

}

</style>

</head>
