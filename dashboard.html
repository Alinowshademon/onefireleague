<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∆NE FIRE LEAGUE Dashboard</title>


<style>

/* =================================
   GLOBAL
================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("onebg1.jpg") center center/cover no-repeat fixed;
    min-height:100vh;
    padding:90px 20px 100px;
    position:relative;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(10,18,32,.65);
    z-index:-1;
}


/* =================================
   FIXED TOP HEADER
================================= */

.top-header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:65px;

    background:#1b2740;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:0 5px 20px rgba(0,195,255,.18);

    z-index:1500;
}

.top-header h1{
    color:#18cfff;
    font-size:26px;
    font-weight:bold;
    margin:0;

    text-shadow:0 0 15px rgba(24,207,255,.7);
}


/* =================================
   SLIDER
================================= */

.slider-wrapper{
    width:100%;
    max-width:430px;
    margin:0 auto 25px;
}

.slide-container{
    width:100%;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:#0d1829;
    box-shadow:0 0 25px rgba(0,195,255,.20);
}

.slide-track{
    display:flex;
    width:100%;
    transition:transform .5s ease;
    touch-action:pan-y;
}

.slide-item{
    flex:0 0 100%;
    width:100%;
    aspect-ratio:16 / 9;
}

.slide-item img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.slide-dots{
    position:absolute;
    bottom:10px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
    z-index:5;
}

.slide-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    transition:.3s;
}

.slide-dot.active{
    background:#18cfff;
    box-shadow:0 0 8px #18cfff;
    transform:scale(1.2);
}

.slide-loading{
    width:100%;
    aspect-ratio:16 / 9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9fb1c3;
    font-size:14px;
}


/* =================================
   DASHBOARD CONTAINER
================================= */

.container{
    width:100%;
    max-width:430px;
    margin:0 auto;
    background:#1b2740;
    border-radius:28px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,195,255,.18);
}

#welcome{
    color:#ffd633;
    font-size:24px;
    margin-bottom:30px;
}

button{
    width:100%;
    margin:12px 0;
    padding:18px;
    border:none;
    border-radius:15px;
    background:#19c7f7;
    color:#07111d;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 6px 18px rgba(0,200,255,.35);
}

button:hover{
    background:#32d5ff;
    transform:translateY(-3px);
    box-shadow:0 0 20px #19c7f7;
}

button:active{
    transform:scale(.97);
}


/* =================================
   FOOTER
================================= */

.footer{
    margin-top:25px;
    color:#b8c7d6;
    font-size:14px;
}


/* =================================
   BOTTOM NAVIGATION
================================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:65px;
    background:#1b2740;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,195,255,.18);
    z-index:1500;
}

.bottom-nav a{
    text-decoration:none;
    font-size:28px;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.2s;
}

.bottom-nav a:hover{
    background:rgba(25,199,247,.12);
    transform:scale(1.08);
}


/* =================================
   MOBILE
================================= */

@media(max-width:480px){

    body{
        padding:85px 15px 100px;
    }

    .top-header{
        height:60px;
    }

    .top-header h1{
        font-size:22px;
    }

    .slider-wrapper{
        margin-bottom:20px;
    }

    .slide-container{
        border-radius:18px;
    }

    .container{
        padding:30px 20px;
        border-radius:24px;
    }

    #welcome{
        font-size:22px;
    }

    button{
        font-size:17px;
        padding:16px;
    }

}


/* =================================
   END CSS
================================= */

</style>

</head>
