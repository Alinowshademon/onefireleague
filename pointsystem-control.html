<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>∆NE FIRE LEAGUE | Point System Control</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0b1220;
color:#fff;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:#1b2940;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,200,255,.25);
}

h1{
text-align:center;
color:#00cfff;
font-size:36px;
margin-bottom:8px;
text-shadow:0 0 10px rgba(0,200,255,.5);
}

h2{
text-align:center;
color:#ffd33d;
margin-bottom:25px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#24354a;
color:#fff;
font-size:16px;
}

input:focus{
outline:2px solid #00cfff;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#00cfff;
color:#0b1220;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00b4e6;
}

#status{
margin-top:20px;
text-align:center;
font-weight:bold;
color:#7CFC00;
}

.back{
text-align:center;
margin-top:25px;
}

.back a{
display:inline-block;
padding:12px 30px;
background:#00cfff;
color:#0b1220;
text-decoration:none;
font-weight:bold;
border-radius:10px;
}

.back a:hover{
background:#00b4e6;
}

</style>

</head>

<body>

<div class="container">

<h1>🏆 ∆NE FIRE LEAGUE</h1>
<h2>Point System Control</h2>

<div class="form-group">
<label>🥇 1st Place Points</label>
<input type="number" id="p1">
</div>

<div class="form-group">
<label>🥈 2nd Place Points</label>
<input type="number" id="p2">
</div>

<div class="form-group">
<label>🥉 3rd Place Points</label>
<input type="number" id="p3">
</div>

<div class="form-group">
<label>4th Place Points</label>
<input type="number" id="p4">
</div>

<div class="form-group">
<label>5th Place Points</label>
<input type="number" id="p5">
</div>

<div class="form-group">
<label>6th Place Points</label>
<input type="number" id="p6">
</div>

<div class="form-group">
<label>7th Place Points</label>
<input type="number" id="p7">
</div>

<div class="form-group">
<label>8th Place Points</label>
<input type="number" id="p8">
</div>

<div class="form-group">
<label>9th Place Points</label>
<input type="number" id="p9">
</div>

<div class="form-group">
<label>10th Place Points</label>
<input type="number" id="p10">
</div>

<div class="form-group">
<label>💀 Elimination Point</label>
<input type="number" id="elimination">
</div>

<button id="saveBtn">💾 Save Point System</button>

<div id="status"></div>

<div class="back">
<a href="dashboard.html">⬅ Back</a>
</div>

</div>

<script type="module" src="pointsystem-control.js"></script>

</body>

</html>
