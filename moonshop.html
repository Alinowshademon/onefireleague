<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoonShop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d1117;
color:white;
}

/* Header */

header{
position:fixed;
top:0;
left:0;
width:100%;
height:65px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
box-shadow:0 3px 10px rgba(0,0,0,.4);
z-index:999;
}

.logo{
font-size:26px;
font-weight:bold;
color:#8ab4ff;
}

.right{
display:flex;
align-items:center;
gap:18px;
font-size:28px;
cursor:pointer;
}

/* Store */

.store{
margin-top:90px;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#1b2433;
border-radius:15px;
padding:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.image{
width:100%;
height:180px;
border:2px dashed #555;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
color:#888;
font-size:18px;
margin-bottom:15px;
}

.name{
font-size:20px;
font-weight:bold;
margin-bottom:8px;
}

.price{
color:#8ab4ff;
font-size:18px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#2563eb;
}
</style>
</head>

<body>

<header>

<div class="logo">🌙 MoonShop</div>

<div class="right">
🛒
☰
</div>

</header>

<div class="store">

<div class="card">
<div class="image">Image</div>
<div class="name">Item 1</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

<div class="card">
<div class="image">Image</div>
<div class="name">Item 2</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

<div class="card">
<div class="image">Image</div>
<div class="name">Item 3</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

<div class="card">
<div class="image">Image</div>
<div class="name">Item 4</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

<div class="card">
<div class="image">Image</div>
<div class="name">Item 5</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

<div class="card">
<div class="image">Image</div>
<div class="name">Item 6</div>
<div class="price">$0.00</div>
<button>Add to Cart</button>
</div>

</div>

</body>
</html>
